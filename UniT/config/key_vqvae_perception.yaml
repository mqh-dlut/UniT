# 原UniT的3D姿态估计任务

name: train_vqvae_perception_3Dpose_contact_weight
_target_: UniT.workspace.train_vqvae_perception_workspace.TrainVqvaePerceptionWorkspace
dataset_path: &dataset_path /mnt/storage/mmm/recur_UniT/3D_pose_gelsight
horizon: &horizon 1

task:
  dataset:
    _target_: UniT.dataset.tactile_perception_dataset.TactilePerceptionDataset
    resized_image_shape: [128,160]
    shape_meta:   
      obs:    
        tactile_image:
          shape: [3, 240, 320]
          type: rgb
        3Dpose:
          shape: [4]
          type: low_dim
    dataset_path: *dataset_path
    horizon: *horizon
    seed: 42
    val_ratio: 0.1
    max_train_episodes: null


model:
  _target_: UniT.perception.vqvae_perception.VqvaePerception
  use_temporal_transformer: False # 判断使用哪种model, TemporalVQModel还是VQModel, 使用哪种model就要使用对应的ckpt
  use_temporal_fusion: False # 使用TemporalVQModel做任务时是否要经过transformer
  vq_model_config:
    embed_dim: 3
    n_embed: 1024
    ckpt_path: /mnt/nvme0n1/home/mmm/projects/UniT/representation_models/2026-10-14T09-39-16contact_weighted_vq/checkpoints/checkpoint-epoch=249.ckpt
    ddconfig:
      double_z: False
      z_channels: 3
      resolution: 128
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1,1,2,4] 
      num_res_blocks: 2
      attn_resolutions: [16]
      dropout: 0.0
    lossconfig:
      target: UniT.taming.modules.losses.vqperceptual.VQLPIPSWithDiscriminator
      params:
        disc_conditional: False
        disc_in_channels: 3
        disc_start: 10000
        disc_weight: 0.8
        codebook_weight: 1.0
  latent_shape: [3,16,20]
  freeze_encoder: True
dataloader:
  batch_size: 128 # 128
  num_workers: 8
  shuffle: true
  pin_memory: false
  persistent_workers: False

val_dataloader:
  batch_size: 128 # 128
  num_workers: 8
  shuffle: False
  pin_memory: false
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  resume: False # 用来控制接续训练的
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 400
  gradient_accumulate_every: 1
  checkpoint_every: 1
  val_every: 10
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0


logging:
  project: 3Dpose_benchmark
  resume: False # 用来控制接续训练的
  mode: disabled
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}
  tags: ["${name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: train_loss
    mode: min
    k: 5
    format_str: 'epoch={epoch:04d}-train_loss={train_loss:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}
    subdir: ${hydra.job.num}