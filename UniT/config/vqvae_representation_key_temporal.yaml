# Allen Key数据训练Transformer, 微调UniT原Encoder, 也可以不微调, 从头训

_target_: UniT.workspace.train_vqvae_representation_workspace.TrainVqvaeRepresentationWorkspace
base_learning_rate: 4.5e-6

shape_meta: &shape_meta
  obs:    
    tactile_image:
      shape: [3, 240, 320]
      type: rgb
with_vq: true
use_temporal_transformer: true # 用transformer微调就是true, 不是就是false
# baseline_ckpt: "/mnt/storage/mmm/recur_UniT/2024-08-01T15-09-47vq/checkpoints/checkpoint-epoch=342.ckpt"
baseline_ckpt: null
datatype: key
model:
  embed_dim: 3
  n_embed: 1024
  ddconfig:
    double_z: False
    z_channels: 3
    resolution: 128
    in_channels: 3
    out_ch: 3
    ch: 128
    ch_mult: [1,1,2,4] # representation shape 16x20
    num_res_blocks: 2
    attn_resolutions: [16]
    dropout: 0.0
  lossconfig:
    target: UniT.taming.modules.losses.vqperceptual.VQLPIPSWithDiscriminator
    params:
      disc_conditional: False
      disc_in_channels: 3
      disc_start: 0 # 判别器启用step
      disc_weight: 0.8
      codebook_weight: 1.0
dataset:
  resized_image_shape: [128,160]
  shape_meta:
    obs:    
      tactile_image:
        shape: [3, 240, 320]
        type: rgb

  dataset_path: /mnt/storage/mmm/recur_UniT/allen_key_gelsight # data/allen_key_gelsight
  horizon: 4 # 一条训练数据包括多少个连续时间步 1 4
  max_train_episodes: null
  pad_after: 0 # 前面补几帧 1 0
  pad_before: 0 # 后面补几帧 1 0
  seed: 42
  val_ratio: 0
val_dataloader:
  batch_size: 32
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: false
dataloader:
  batch_size: 8 # 32
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: true
gpus: '0,1'
batch_size: 8 # 32
accumulate_grad_batches: 2
seed: 42
trainer:
  name: "vq_representiaon_dubug"
  resume: ""
  base: []
  no_test: true # false
  project: null
  debug: false
  seed: 42
  postfix: ""
  train: true
save_every: 1
max_epochs: 344