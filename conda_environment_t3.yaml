name: unitenv_t3

channels:
  - pytorch
  - pytorch3d
  - nvidia
  - conda-forge

dependencies:
  - python=3.9
  - pip=22.2.2

  # =========================
  # 修改：适配 T3
  # 原来：
  # cudatoolkit=11.6
  # pytorch=1.12.1
  # torchvision=0.13.1
  # pytorch3d=0.7.0
  # =========================
  - pytorch=2.1.0
  - torchvision=0.16.0
  - pytorch-cuda=11.8
  - pytorch3d=0.7.5

  # =========================
  # 原 UniT 环境，尽量全部保留
  # =========================
  - numpy=1.23.3
  - numba==0.56.4
  - scipy==1.9.1
  - py-opencv=4.6.0
  - cffi=1.15.1
  - ipykernel=6.16
  - matplotlib=3.6.1
  - zarr=2.12.0
  - numcodecs=0.10.2
  - h5py=3.7.0

  # hydra-core 暂时不在这里装
  # 移到下面 pip 中，避免你刚才遇到的
  # sympy / antlr conda 求解冲突

  - einops=0.4.1
  - tqdm=4.64.1

  - dill=0.3.5.1

  # 新增：防止自动变成 multiprocess 0.70.14，
  # 再把 dill 升到 >=0.3.6
  - multiprocess=0.70.13

  - scikit-video=1.1.11
  - scikit-image=0.19.3
  - gym=0.21.0
  - pymunk=6.2.1
  - wandb=0.13.3
  - threadpoolctl=3.1.0
  - shapely=1.8.4
  - cython=0.29.32
  - imageio=2.22.0
  - imageio-ffmpeg=0.4.7
  - termcolor=2.0.1
  - tensorboard=2.10.1
  - tensorboardx=2.5.1
  - psutil=5.9.2
  - click=8.0.4
  - boto3=1.24.96
  - accelerate=0.13.2
  - datasets=2.6.1
  - diffusers=0.11.1
  - av=10.0.0
  - cmake=3.24.3
  - llvm-openmp=14
  - imagecodecs==2022.8.8
  - timm=0.9.7

  - pip:
      # =========================
      # 原 UniT pip 依赖
      # =========================
      - ray[default,tune]==2.2.0
      - free-mujoco-py==2.1.6
      - pygame==2.1.2

      - robosuite @ https://github.com/cheng-chi/robosuite/archive/277ab9588ad7a4f4b55cf75508b44aa67ec171f0.tar.gz

      - robomimic==0.2.0
      - pytorchvideo==0.1.5
      - imagecodecs==2022.9.26

      - r3m @ https://github.com/facebookresearch/r3m/archive/b2334e726887fa0206962d7984c69c5fb09cceab.tar.gz

      # 之前已经遇到过 MuJoCo 自动选择新版的问题
      - mujoco==2.3.7
      - dm-control==1.0.9

      # 原来没锁版本，现在锁住
      - byol-pytorch==0.8.2
      - pytorch-lightning==1.0.8

      # Python 3.9 不能再直接写最新版 rerun-sdk。
      # 0.17.0 支持 Python >=3.8
      - rerun-sdk==0.17.0

      # =========================
      # hydra 移到 pip
      # =========================
      - hydra-core==1.2.0

      # =========================
      # T3 明确需要、原 YAML 没直接写的包
      # =========================
      - pandas==2.2.3
      - pyarrow==21.0.0
      - webdataset==0.2.100
      - natsort==8.4.0
      - autolab-core==1.1.1